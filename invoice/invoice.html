<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cool Breaze – Invoice</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --blue:   #1a8fc1;
  --dark:   #0d2137;
  --light:  #e8f5fc;
  --border: #d0e8f5;
  --muted:  #6b8fa8;
  --bg:     #f4fafd;
  --red:    #e05c5c;
}

body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--dark); }

/* ── LAYOUT ── */
.app { display: flex; min-height: 100vh; }

/* LEFT */
.editor {
  width: 400px; min-width: 400px;
  background: #fff; border-right: 1px solid var(--border);
  height: 100vh; position: sticky; top: 0;
  overflow-y: auto; display: flex; flex-direction: column;
}

.editor-top {
  background: var(--dark); padding: 18px 22px;
  display: flex; align-items: center; gap: 10px;
}
.editor-top .logo { font-size: 20px; }
.editor-top h1 { color: #fff; font-size: 16px; font-weight: 700; }
.editor-top h1 span { color: #0ec6e6; }
.editor-top p { color: rgba(255,255,255,0.5); font-size: 11px; margin-top: 1px; }

.editor-body { padding: 18px 22px; flex: 1; display: flex; flex-direction: column; gap: 20px; }

.sec { }
.sec-title {
  font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--blue);
  border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-bottom: 12px;
}

.field { margin-bottom: 10px; }
.field:last-child { margin-bottom: 0; }
label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }

input, textarea {
  font-family: 'Inter', sans-serif; font-size: 13px; color: var(--dark);
  border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px;
  background: var(--bg); width: 100%; outline: none;
  transition: border-color 0.15s;
}
input:focus, textarea:focus { border-color: var(--blue); background: #fff; }
textarea { resize: vertical; min-height: 50px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* items */
.item-cols {
  display: grid; grid-template-columns: 1fr 90px 28px;
  gap: 6px; margin-bottom: 6px;
}
.item-cols span { font-size: 10px; font-weight: 600; color: var(--muted); }

.items-list { display: flex; flex-direction: column; gap: 6px; }

.item-row {
  display: grid; grid-template-columns: 1fr 90px 28px;
  gap: 6px; align-items: center;
  animation: pop .15s ease;
}
@keyframes pop { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
.item-row input { background: #fff; }

.del { background: none; border: none; cursor: pointer; color: #c0d8e8; font-size: 16px; padding: 2px 5px; border-radius: 4px; }
.del:hover { color: var(--red); }

.add-btn {
  margin-top: 6px; width: 100%; padding: 8px;
  background: var(--light); border: 1px dashed var(--blue);
  border-radius: 6px; color: var(--blue); font-family: 'Inter', sans-serif;
  font-size: 12px; font-weight: 600; cursor: pointer;
}
.add-btn:hover { background: #d4eefc; }

/* footer */
.editor-foot {
  padding: 14px 22px 20px; border-top: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 8px;
}
.btn {
  width: 100%; padding: 10px; border: none; border-radius: 8px;
  font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-primary { background: var(--dark); color: #fff; }
.btn-primary:hover { background: #1a3a55; }
.btn-outline { background: var(--light); color: var(--dark); border: 1px solid var(--border); }
.btn-outline:hover { background: #d4eefc; }
.mob-only { display: none; }

/* RIGHT */
.preview-wrap {
  flex: 1; padding: 32px 40px; overflow-y: auto;
  display: flex; flex-direction: column; align-items: center;
}
.preview-label {
  font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--muted);
  align-self: flex-start; margin-bottom: 16px;
}

/* ── INVOICE ── */
#inv {
  width: 100%; max-width: 680px;
  background: #fff; border-radius: 4px;
  box-shadow: 0 2px 24px rgba(13,33,55,.10);
  overflow: hidden;
}

.inv-head {
  background: var(--dark); padding: 18px 28px;
  display: flex; justify-content: space-between; align-items: center;
}
.inv-brand { color: #fff; font-size: 17px; font-weight: 700; }
.inv-brand span { color: #0ec6e6; }
.inv-contact { color: rgba(255,255,255,.5); font-size: 11px; margin-top: 3px; line-height: 1.5; }

.inv-right { text-align: right; }
.inv-word { color: rgba(255,255,255,.12); font-size: 20px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
.inv-num  { color: #0ec6e6; font-size: 11.5px; font-weight: 600; margin-top: 2px; }
.inv-dt   { color: rgba(255,255,255,.4); font-size: 10.5px; margin-top: 1px; }

.inv-body { padding: 18px 28px 36px; }

.inv-parties {
  display: flex; gap: 32px;
  margin-bottom: 20px; padding: 10px 0 10px;
  border-bottom: 1px solid var(--border);
}
.inv-parties > div { flex: 1; }
.p-lbl  { font-size: 9px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--blue); margin-bottom: 3px; }
.p-name { font-size: 13px; font-weight: 600; margin-bottom: 1px; }
.p-det  { font-size: 11px; color: var(--muted); line-height: 1.5; }

/* table */
.inv-tbl { width: 100%; border-collapse: collapse; margin-bottom: 20px; border: 1px solid var(--blue); }
.inv-tbl thead { background: var(--dark); }
.inv-tbl th {
  padding: 9px 12px; font-size: 9.5px; font-weight: 700;
  letter-spacing: 1.2px; text-transform: uppercase; color: #fff;
  text-align: left; border-right: 1px solid rgba(255,255,255,.12);
}
.inv-tbl th:last-child { text-align: right; border-right: none; }
.inv-tbl td {
  padding: 11px 12px; font-size: 13px; border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
}
.inv-tbl td:last-child { text-align: right; font-weight: 600; color: var(--blue); border-right: none; }
.inv-tbl tbody tr:nth-child(even) { background: var(--light); }
.inv-tbl tbody tr:last-child td   { border-bottom: none; }
.inv-tbl .no-items td { text-align: center; color: #ccc; font-style: italic; padding: 20px; }
.num-col { color: var(--muted); font-size: 11px; width: 36px; }

/* totals */
.inv-totals { margin-left: auto; width: 210px; }
.t-row { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); padding: 6px 0; border-bottom: 1px solid var(--border); }
.t-row.total { border-top: 2px solid var(--blue); border-bottom: none; margin-top: 2px; padding-top: 10px; font-size: 15px; font-weight: 700; color: var(--dark); }
.t-row.total .tval { color: var(--blue); }

.inv-notes { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); line-height: 1.65; }
.inv-notes b { display: block; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--dark); margin-bottom: 4px; }

.inv-thanks { margin-top: 36px; text-align: center; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--border); }

/* ── MOBILE OVERLAY ── */
.overlay {
  display: none; position: fixed; inset: 0; z-index: 999;
  background: rgba(13,33,55,.6); overflow-y: auto; padding: 14px 10px 40px;
}
.overlay.on { display: block; }
.ov-bar { display: flex; gap: 8px; margin-bottom: 12px; }
.ov-bar button {
  font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600;
  border: none; border-radius: 20px; padding: 8px 16px; cursor: pointer;
}
.ov-close { background: #fff; color: var(--dark); }
.ov-dl    { background: var(--blue); color: #fff; margin-left: auto; }
#inv-mob  { background: #fff; border-radius: 4px; overflow: hidden; }

/* ── MOBILE ── */
@media (max-width: 720px) {
  .app { flex-direction: column; }
  .editor { width: 100%; min-width: unset; height: auto; position: static; }
  .preview-wrap { display: none; }
  .mob-only { display: flex; }
}

@media print {
  .editor, .preview-label { display: none !important; }
  .preview-wrap { padding: 0; }
  #inv { box-shadow: none; }
}
</style>
</head>
<body>

<!-- mobile overlay -->
<div class="overlay" id="overlay">
  <div class="ov-bar">
    <button class="ov-close" onclick="closeOv()">✕ Close</button>
    <button class="ov-dl" onclick="dlPDF()">⬇ Download PDF</button>
  </div>
  <div id="inv-mob"></div>
</div>

<div class="app">

  <!-- FORM -->
  <aside class="editor">
    <div class="editor-top">
      <div class="logo">❄</div>
      <div>
        <h1>Cool <span>Breaze</span></h1>
        <p>Invoice Builder</p>
      </div>
    </div>

    <div class="editor-body">

      <div class="sec">
        <div class="sec-title">Your Info</div>
        <div class="field">
          <label>Business Name</label>
          <input id="fromName" value="Cool Breaze" oninput="render()">
        </div>
        <div class="field">
          <label>Name / Phone</label>
          <textarea id="fromDetail" oninput="render()">Waseem Abbas
03047473355</textarea>
        </div>
      </div>

      <div class="sec">
        <div class="sec-title">Client</div>
        <div class="field">
          <label>Client Name</label>
          <input id="toName" placeholder="Client name" oninput="render()">
        </div>
        <div class="field">
          <label>Address / Phone</label>
          <textarea id="toDetail" placeholder="optional" oninput="render()"></textarea>
        </div>
      </div>

      <div class="sec">
        <div class="sec-title">Invoice</div>
        <div class="row2">
          <div class="field">
            <label>Invoice #</label>
            <input id="invNo" placeholder="INV-001" oninput="render()">
          </div>
          <div class="field">
            <label>Date</label>
            <input id="invDate" type="date" oninput="render()">
          </div>
        </div>
        <div class="field">
          <label>Tax %</label>
          <input id="tax" type="number" value="0" min="0" max="100" oninput="render()">
        </div>
      </div>

      <div class="sec">
        <div class="sec-title">Items</div>
        <div class="item-cols">
          <span>Description</span><span>Amount (Rs)</span><span></span>
        </div>
        <div class="items-list" id="itemsList"></div>
        <button class="add-btn" onclick="addItem()">+ Add Item</button>
      </div>

      <div class="sec">
        <div class="sec-title">Notes</div>
        <div class="field">
          <textarea id="notes" placeholder="e.g. Payment due within 7 days" oninput="render()"></textarea>
        </div>
      </div>

    </div>

    <div class="editor-foot">
      <button class="btn mob-only btn-outline" onclick="openOv()">👁 Preview Invoice</button>
      <button class="btn btn-primary" onclick="dlPDF()">⬇ Download PDF</button>
      <button class="btn btn-outline" onclick="window.print()">🖨 Print</button>
    </div>
  </aside>

  <!-- PREVIEW -->
  <main class="preview-wrap">
    <div class="preview-label">Live Preview</div>
    <div id="inv"></div>
  </main>
</div>

<script>
let items = [], nid = 1;

function g(id){ return document.getElementById(id).value.trim(); }

function esc(s){
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\n/g,'<br>');
}
function ea(s){ return String(s).replace(/"/g,'&quot;'); }
function fmt(n){ return n.toLocaleString('en-PK',{minimumFractionDigits:0,maximumFractionDigits:0}); }
function fmtDate(d){
  return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
}

function buildHTML(){
  const fn = g('fromName')||'Cool Breaze';
  const fd = g('fromDetail');
  const tn = g('toName');
  const td = g('toDetail');
  const no = g('invNo')||'—';
  const dt = g('invDate');
  const tx = parseFloat(document.getElementById('tax').value)||0;
  const nt = g('notes');

  // brand two-tone
  const pp = fn.trim().split(' ');
  const b1 = pp.length>1 ? pp.slice(0,-1).join(' ')+' ' : fn;
  const b2 = pp.length>1 ? pp[pp.length-1] : '';

  let sub=0, rows='';
  if(!items.length){
    rows='<tr class="no-items"><td colspan="3">No items yet</td></tr>';
  } else {
    items.forEach((it,i)=>{
      const a=parseFloat(it.amount)||0; sub+=a;
      rows+=`<tr>
        <td class="num-col">${i+1}</td>
        <td>${esc(it.desc)||'<span style="color:#ccc">—</span>'}</td>
        <td>${fmt(a)}</td>
      </tr>`;
    });
  }

  const taxAmt = sub*tx/100;
  const total  = sub+taxAmt;

  const taxRow = tx>0
    ? `<div class="t-row"><span>Tax (${tx}%)</span><span>Rs ${fmt(taxAmt)}</span></div>` : '';

  const notesBlock = nt
    ? `<div class="inv-notes"><b>Notes</b>${esc(nt)}</div>` : '';

  return `
    <div class="inv-head">
      <div>
        <div class="inv-brand">${esc(b1)}<span>${esc(b2)}</span></div>
        <div class="inv-contact">${esc(fd)}</div>
      </div>
      <div class="inv-right">
        <div class="inv-word">Invoice</div>
        <div class="inv-num">#${esc(no)}</div>
        <div class="inv-dt">${dt?fmtDate(dt):''}</div>
      </div>
    </div>

    <div class="inv-body">
      <div class="inv-parties">
        <div>
          <div class="p-lbl">From</div>
          <div class="p-name">${esc(fn)}</div>
          <div class="p-det">${esc(fd)}</div>
        </div>
        <div>
          <div class="p-lbl">Bill To</div>
          <div class="p-name">${tn?esc(tn):'<span style="color:#ccc">—</span>'}</div>
          <div class="p-det">${esc(td)}</div>
        </div>
      </div>

      <table class="inv-tbl">
        <thead>
          <tr>
            <th style="width:36px">#</th>
            <th>Description</th>
            <th style="width:110px;text-align:right">Amount (Rs)</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>

      <div class="inv-totals">
        <div class="t-row"><span>Subtotal</span><span>Rs ${fmt(sub)}</span></div>
        ${taxRow}
        <div class="t-row total"><span>Total</span><span class="tval">Rs ${fmt(total)}</span></div>
      </div>

      ${notesBlock}
      <div class="inv-thanks">— Thank You —</div>
    </div>`;
}

function render(){
  document.getElementById('inv').innerHTML = buildHTML();
}

function renderForm(){
  const c=document.getElementById('itemsList'); c.innerHTML='';
  items.forEach(it=>{
    const r=document.createElement('div'); r.className='item-row';
    r.innerHTML=`
      <input value="${ea(it.desc)}" placeholder="Description" oninput="upd(${it.id},'desc',this.value)">
      <input type="number" value="${it.amount}" placeholder="0" min="0" oninput="upd(${it.id},'amount',this.value)">
      <button class="del" onclick="del(${it.id})">×</button>`;
    c.appendChild(r);
  });
}

function addItem(){
  const id=nid++;
  items.push({id,desc:'',amount:''});
  renderForm();
  setTimeout(()=>{ const e=document.querySelector(`#itemsList .item-row:last-child input`); if(e) e.focus(); },50);
  render();
}
function del(id){ items=items.filter(i=>i.id!==id); renderForm(); render(); }
function upd(id,f,v){ const i=items.find(x=>x.id===id); if(i){i[f]=v; render();} }

function openOv(){
  document.getElementById('inv-mob').innerHTML=buildHTML();
  document.getElementById('overlay').classList.add('on');
  document.body.style.overflow='hidden';
}
function closeOv(){
  document.getElementById('overlay').classList.remove('on');
  document.body.style.overflow='';
}

function dlPDF(){
  const no=document.getElementById('invNo').value||'invoice';
  const w=document.createElement('div');
  w.style.cssText='position:fixed;left:-9999px;top:0;width:794px;background:#fff;font-family:Inter,sans-serif;z-index:-1;';
  w.innerHTML=buildHTML();
  document.body.appendChild(w);
  setTimeout(()=>{
    html2pdf().set({
      margin:[8,8,8,8], filename:`${no}.pdf`,
      image:{type:'jpeg',quality:.98},
      html2canvas:{scale:2,useCORS:true,backgroundColor:'#fff',width:794,windowWidth:794},
      jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}
    }).from(w).save().then(()=>document.body.removeChild(w));
  },300);
}

// init
document.getElementById('invDate').value=new Date().toISOString().split('T')[0];
addItem(); addItem(); addItem();
render();
</script>
</body>
</html>
